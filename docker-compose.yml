services:
  whatsapp-bot:
    build: .
    container_name: whatsapp_bot
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - evolution_evolution-net

networks:
  evolution_evolution-net:
    external: true
